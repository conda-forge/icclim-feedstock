{% set name = "icclim" %}
{% set version = "7.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 146dd66c2c8470a34b248fca449b2aaff49033df5ed2612952ebb8e1e8177436

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core
  run:
    - python >={{ python_min }}
    - cf-xarray >=0.7.4
    - cftime >=1.6.2
    - dask-core >=2024.11.1
    - jinja2 >=3.0
    - netcdf4 >=1.5.7
    - numcodecs >=0.10.0
    - numpy >=1.24
    - pandas >=2.2.0
    - pint >=0.25
    - typing-extensions >=4.5.0
    - xarray >=2024.11.0
    - xclim >=0.56.0
    - zarr >=2.12.0
    - dateparser >=1.1.4
    - fsspec

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - icclim
    - icclim.ecad
    - icclim.generic
  commands:
    - pip check

about:
  summary: icclim (Index Calculation CLIMate) is a python library for climate indices calculation.
  home: https://github.com/cerfacs-globc/icclim
  doc_url: https://icclim.readthedocs.io/
  dev_url: https://github.com/cerfacs-globc/icclim
  license: Apache-2.0
  license_file: LICENSE
  description: |
    icclim (Index Calculation CLIMate) is a python library for climate indices calculation.
    It wraps xclim, xarray and dask in a staight forward API. It is first meant to compute
    the ECA&D indices but also provide an API to create customized indices based on a few operators.

extra:
  recipe-maintainers:
    - pagecp
